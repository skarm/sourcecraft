name: API contracts

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Compare all published contracts
        run: go run ./internal/checkcontracts -out "$RUNNER_TEMP/api-contracts"
      - name: Verify local contracts and generated SDK
        if: ${{ !cancelled() }}
        run: go test -count=1 ./...
      - name: Check public Go API compatibility
        if: ${{ !cancelled() }}
        run: go run ./internal/apicheck
      - name: Publish contract summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/api-contracts/summary.md" ]; then
            cat "$RUNNER_TEMP/api-contracts/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload contract report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-contracts
          path: ${{ runner.temp }}/api-contracts/
          if-no-files-found: warn
          retention-days: 14
